name: Patch dashboard notifications

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply dashboard notification hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch notification polling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/integrations.js')
          text = path.read_text()

          old = '''function notificationEnabled() {
  const saved = localStorage.getItem("known.notify.conversations");
  if (saved !== null) return saved !== "false";
  const toggle = $("#notify-conversations");
  return toggle ? toggle.checked : true;
}'''
          new = '''function notificationEnabled() {
  const toggle = $("#notify-conversations");
  if (toggle) return toggle.checked;
  const saved = localStorage.getItem("known.notify.conversations");
  return saved !== "false";
}'''
          if old not in text:
              raise SystemExit('notificationEnabled target not found')
          text = text.replace(old, new, 1)

          old = '''    const response = await api("/api/integrations/gmail/messages");'''
          new = '''    const response = await api(`/api/integrations/gmail/messages?_=${Date.now()}`, { cache: "no-store" });'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 inbox endpoint calls, found {count}')
          text = text.replace(old, new)

          old = '''  inboxRefreshTimer = window.setInterval(() => {
    const activeView = document.querySelector(".view.active-view")?.id;
    if (activeView !== "view-inbox" && activeView !== "view-conversation" && activeView !== "view-overview") return;
    refreshInboxMessages().catch((error) => console.warn("Live inbox refresh failed:", error));
  }, 2000);'''
          new = '''  inboxRefreshTimer = window.setInterval(() => {
    refreshInboxMessages().catch((error) => console.warn("Live inbox refresh failed:", error));
  }, 2000);'''
          if old not in text:
              raise SystemExit('startInboxRefresh target not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/integrations.js
          git rm .github/workflows/patch-notifications.yml
          git commit -m "chore: apply dashboard notification hardening"
          git push
