name: Gmail Poller

on:
  push:
    branches: [main]
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Known deployment after a main update
        if: github.event_name == 'push'
        run: sleep 90
      - name: Poll Known Gmail inboxes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -X POST \
            -H "X-GitHub-Token: $GITHUB_TOKEN" \
            https://known-sbbp.onrender.com/api/internal/gmail/poll-all
