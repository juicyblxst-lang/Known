name: Gmail Poller

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: known-gmail-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll Known Gmail inboxes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -X POST \
            -H "X-GitHub-Token: $GITHUB_TOKEN" \
            https://known-sbbp.onrender.com/api/internal/gmail/poll-all
