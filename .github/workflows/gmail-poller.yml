name: Gmail Poller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll Known Gmail inboxes
        env:
          CRON_SECRET: ${{ secrets.KNOWN_GMAIL_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 120 \
            -X POST \
            -H "X-Known-Cron-Secret: $CRON_SECRET" \
            https://known-sbbp.onrender.com/api/internal/gmail/poll-all