<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Known — Create account</title><link rel="stylesheet" href="./styles.css"></head><body class="auth-page"><main class="auth-card"><div class="brand">Known</div><div class="eyebrow">SUPPORT WORKSPACE</div><h1>Create account</h1><p class="auth-copy">Create your Known workspace account.</p><form id="signup"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@company.com"></label><label>Password<input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label><button type="submit">Create account</button><div id="error" role="alert"></div><div id="success" role="status"></div></form><p class="auth-copy"><a href="./login.html">Back to sign in</a></p></main><script type="module">import {signUp} from './auth.js';document.querySelector('#signup').addEventListener('submit',async e=>{e.preventDefault();const error=document.querySelector('#error');const success=document.querySelector('#success');error.textContent='';success.textContent='';const button=e.target.querySelector('button');button.disabled=true;button.textContent='Creating account…';try{const result=await signUp(document.querySelector('#email').value,document.querySelector('#password').value);if(result.requiresEmailConfirmation){success.textContent='Account created. Check your email to confirm your address, then sign in.';return}location.href='./index.html'}catch(err){error.textContent=err.message}finally{button.disabled=false;button.textContent='Create account'}});</script></body></html>
