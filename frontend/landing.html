<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Known — Customer support that remembers</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Landing-only presentation: mirrors the existing Known design system. */
    .landing-page{background:#f6f7f9;color:#17191d;min-height:100vh}
    .landing-nav{height:68px;border-bottom:1px solid #e4e6ea;background:#fff}
    .landing-nav-inner{height:100%;max-width:1240px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
    .landing-nav .brand{padding:0;font-size:22px;font-weight:750;letter-spacing:-.04em;color:#111}
    .landing-links{display:flex;align-items:center;gap:28px}
    .landing-links a,.landing-actions a{color:#555c66;font-size:12px;text-decoration:none}
    .landing-links a:hover,.landing-actions a:hover{color:#17191d}
    .landing-actions{display:flex;align-items:center;justify-content:flex-end;gap:18px}
    .landing-actions .landing-cta{background:#17191d;color:#fff;border-radius:7px;padding:9px 14px;font-weight:650}
    .landing-actions .landing-cta:hover{color:#fff;background:#2a2d31}
    @media(max-width:850px){.landing-nav-inner{padding:0 20px;grid-template-columns:1fr auto}.landing-links{display:none}.landing-actions{gap:12px}}
  </style>
</head>
<body class="landing-page">
  <header class="landing-nav">
    <div class="landing-nav-inner">
      <div class="brand">Known</div>
      <nav class="landing-links" aria-label="Primary navigation">
        <a href="#product">Product</a>
        <a href="#how-it-works">How it works</a>
      </nav>
      <div class="landing-actions">
        <a href="/login.html">Sign in</a>
        <a class="landing-cta" href="/signup.html">Get started</a>
      </div>
    </div>
  </header>
</body>
</html>
