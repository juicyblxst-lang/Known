<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Known — Sign in</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./onboarding.css"></head><body class="auth-page known-auth-page"><main class="auth-card known-auth-card"><div class="brand known-auth-brand">Known</div><div class="eyebrow">SUPPORT WORKSPACE</div><h1>Sign in</h1><p class="auth-copy">Access your customer workspace and memory-backed support history.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="enter your email"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label><button type="submit">Sign in</button><div id="error" role="alert"></div></form><p class="auth-copy"><a href="./signup.html">Create an account</a></p></main><script type="module">import {getSession,signIn,onboardingStatus,invalidateSession} from './auth.js';async function route(session){try{const state=await onboardingStatus(session);location.href=state.completed?'./index.html':'./onboarding.html';}catch(error){invalidateSession();document.querySelector('#error').textContent=error.message||'Your session is no longer valid. Please sign in again.';}}(async()=>{try{const session=await getSession();if(session)await route(session)}catch(error){invalidateSession();document.querySelector('#error').textContent=error.message||'Unable to verify session.'}})();document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='';const button=e.target.querySelector('button');button.disabled=true;button.textContent='Signing in…';try{const session=await signIn(document.querySelector('#email').value.trim(),document.querySelector('#password').value);await route(session)}catch(err){error.textContent=err.message||'Unable to sign in.'}finally{button.disabled=false;button.textContent='Sign in'}});</script></body></html>
