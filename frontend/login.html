<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Known — Sign in</title><link rel="stylesheet" href="./styles.css"></head><body class="auth-page"><main class="auth-card"><div class="brand">Known</div><div class="eyebrow">SUPPORT WORKSPACE</div><h1>Sign in</h1><p class="auth-copy">Access your customer workspace and memory-backed support history.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@company.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label><button type="submit">Sign in</button><div id="error" role="alert"></div></form></main><script type="module">import {signIn} from './auth.js';document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='';const button=e.target.querySelector('button');button.disabled=true;button.textContent='Signing in…';try{await signIn(document.querySelector('#email').value,document.querySelector('#password').value);location.href='./index.html'}catch(err){error.textContent=err.message}finally{button.disabled=false;button.textContent='Sign in'}});</script></body></html>
