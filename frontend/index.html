<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Known — Customer Workspace</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">Known</div>
      <div class="label">CUSTOMERS</div>
      <div id="customer-list"></div>
      <div class="sidebar-foot">Memory-first support</div>
    </aside>
    <main class="main">
      <header>
        <div><div class="eyebrow">CUSTOMER WORKSPACE</div><h1>Known</h1><p id="header-meta">Memory-backed customer support.</p></div>
        <div class="connection"><i></i><span id="connection-status">Not connected</span></div>
      </header>
      <section id="onboarding" class="onboarding panel" hidden></section>
      <section id="workspace" class="layout" hidden>
        <div class="conversation panel">
          <div class="panel-head"><span>Conversation</span><span id="session">No conversation yet</span></div>
          <div id="messages" class="messages"><div class="empty-state">Select a customer to begin.</div></div>
          <form id="composer"><input id="message" autocomplete="off" placeholder="Reply to customer…" /><button>Send</button></form>
        </div>
        <aside class="context">
          <section class="panel"><div class="panel-head">Customer</div><div class="context-body"><h2 id="customer-detail-name">Customer</h2><p id="customer-detail-tier"></p><dl><dt>Email</dt><dd id="customer-detail-email"></dd><dt>Customer ID</dt><dd id="customer-detail-id"></dd></dl></div></section>
          <section class="panel"><div class="panel-head">Orders</div><div id="orders" class="context-body"><div class="empty-state">No orders.</div></div></section>
          <section class="panel memory-panel"><div class="panel-head">Relevant memory <span class="memory-count">0</span></div><div id="memory" class="context-body"><div class="empty-state">No relevant memory found.</div><small class="source">Sibyl Memory</small></div></section>
        </aside>
      </section>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
